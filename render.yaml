services:
  - type: web
    name: estoque-toners
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_LOGIN_PASSWORD
        sync: false
      - key: NODE_ENV
        value: production
